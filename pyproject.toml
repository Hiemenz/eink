[project]
name = "eink"
version = "0.1.0"
description = ""
authors = [{ name = "hiemenz", email = "kevinhiemenz1@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pillow>=11.1.0,<12",
    "pyaml>=25.1.0,<26",
    "requests>=2.32.3,<3",
    "flask>=3.1.3,<4",
    "beautifulsoup4>=4.14.3,<5",
    "lxml>=6.0.2,<7",
    "spidev>=3.6,<4; sys_platform == 'linux'",
    "rpi-gpio>=0.7.1,<0.8; sys_platform == 'linux'",
    "staticmap>=0.5.7,<0.6",
    "geopy>=2.4.1,<3",
    "pyarrow>=16.0.0",
    "pandas>=2.2.0,<3",
    "astral>=3.2,<4",
    "qrcode>=8.2,<9",
    "discord-py>=2.3",
    "python-dotenv>=1.0",
    "yt-dlp>=2024.0.0",
    # AI Brain dependencies
    "duckdb>=1.1.0,<2",
    "anthropic>=0.40.0,<0.41",
    "psutil>=6.0.0,<7",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0,<2"]
discord = ["discord.py>=2.3.2,<3"]
all = ["openai>=1.0.0,<2", "discord.py>=2.3.2,<3"]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.uv]
package = false
