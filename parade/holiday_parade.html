<script>
"use strict";
/* Change the words on the theatre sign here (up to 40 letters). */
const GREETING="Happy Holidays Franklin";

const INK="#1D1D1F",CREAM="#FBF8F1",RED="#E0483B",BLUE="#2E59C9",YEL="#F2BE35",ORG="#EC7C30",
      GRN="#4B9560",SKY="#86BEDD",PINK="#EC95AE",TAN="#D8A56E",BRN="#80523A",GRY="#BDB8AE",PUR="#6C55A8";

const C=(x,y,r,f,x2="")=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${x2}/>`;
const E=(x,y,rx,ry,f,rot=0)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" transform="rotate(${rot} ${x} ${y})"/>`;
const R=(x,y,w,h,r,f,rot=0)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" transform="rotate(${rot} ${x+w/2} ${y+h/2})"/>`;
const P=(d,f)=>`<path d="${d}" fill="${f}"/>`;
const L=(d,s,w)=>`<path d="${d}" fill="none" stroke="${s}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const edged=m=>`<g stroke="#B9B1A0" stroke-width="5" stroke-linejoin="round">${m}</g><g>${m}</g>`;

const GOLD="#D7A53C",PINE="#2F6B47";
function reindeer(x,y,coat,nose){
  const legs=[[-34,-8,-14],[-18,6,16],[20,-4,-12],[36,10,18]].map(([a,b,k])=>L(`M${x+a} ${y+18} L${x+a+b} ${y+46} L${x+a+b+k*.5} ${y+66}`,coat,9)).join("");
  return legs+E(x,y+6,52,27,coat)+L(`M${x+34} ${y-4} L${x+58} ${y-40}`,coat,22)+E(x+70,y-48,27,19,coat,14)
   +E(x+46,y-62,7,17,coat,-38)+L(`M${x+60} ${y-64} L${x+50} ${y-98} L${x+30} ${y-108} M${x+50} ${y-92} L${x+64} ${y-112} M${x+70} ${y-64} L${x+82} ${y-100} L${x+104} ${y-108} M${x+81} ${y-95} L${x+72} ${y-114}`,GOLD,5)
   +C(x+72,y-53,4.5,INK)+C(x+94,y-42,nose?10:7,nose?RED:INK)+E(x-52,y-4,9,13,CREAM,40)+L(`M${x+34} ${y-8} L${x+56} ${y+12}`,RED,7)+C(x+46,y+4,5,YEL);
}
function elf(x,coat,hat,wave){
  return L(`M${x-6} -24 L${x-10} -2 L${x-1} -2 M${x+6} -24 L${x+10} -2 L${x+19} -2`,INK,5)
   +P(`M${x-17} -22 L${x} -64 L${x+17} -22 Z`,coat)+R(x-12,-37,24,5,2,INK)+C(x,-66,13,TAN)
   +P(`M${x-24} -70 L${x-11} -66 L${x-12} -58 Z`,TAN)+P(`M${x+24} -70 L${x+11} -66 L${x+12} -58 Z`,TAN)
   +P(`M${x-16} -73 Q${x-4} -108 ${x+28} -94 Q${x+10} -92 ${x+16} -73 Z`,hat)+C(x+28,-94,5,YEL)+R(x-17,-77,34,7,3,CREAM)
   +C(x-4,-67,2.2,INK)+C(x+6,-67,2.2,INK)+L(`M${x-4} -61 Q${x+1} -57 ${x+6} -61`,INK,2)
   +(wave?L(`M${x+10} -46 L${x+26} -66`,coat,7)+C(x+28,-69,5,TAN):L(`M${x+10} -46 L${x+22} -32`,coat,7)+C(x+23,-30,5,TAN));
}

const SKIN="#F3C9A0",W=1280,STREET=690;
const mirror=m=>m+`<g transform="scale(-1 1)">${m}</g>`;
/* Santa as a giant balloon, drawn around (0,0) */
function santaBalloon(){
  return mirror(E(66,148,48,28,INK,10)+R(24,108,62,38,16,RED)+R(22,130,68,16,8,CREAM))
   +L("M-86 6 Q-146 18 -168 -44",RED,50)+C(-172,-62,28,PINE)+C(-148,-54,12,PINE)
   +L("M86 10 Q142 40 150 78",RED,50)+C(154,94,28,PINE)+C(130,86,12,PINE)
   +E(0,48,118,92,RED)+R(-13,-6,26,142,10,CREAM)+R(-114,66,228,27,13,INK)+R(-27,60,54,39,7,YEL)+R(-14,71,28,17,3,INK)
   +C(0,-78,70,SKIN)+mirror(C(66,-76,15,SKIN))
   +edged(P("M-76 -82 Q-96 -20 -54 -8 Q-50 28 -16 18 Q0 42 16 18 Q50 28 54 -8 Q96 -20 76 -82 Q48 -42 0 -54 Q-48 -42 -76 -82 Z",CREAM))
   +mirror(C(46,-70,13,"#EC9C8C")+C(24,-92,7,INK)+C(27,-95,2.4,CREAM)+L("M10 -110 Q26 -120 42 -108",CREAM,9))
   +P("M-18 -34 Q0 -10 18 -34 Z","#7E2226")+edged(E(-24,-50,32,15,CREAM,16)+E(24,-50,32,15,CREAM,-16))+C(0,-68,17,"#D9786A")
   +P("M-72 -122 Q-52 -220 44 -196 Q110 -182 118 -108 Q86 -150 70 -122 Z",RED)+edged(R(-82,-138,164,30,15,CREAM)+C(120,-102,23,CREAM))
   +E(-44,28,13,34,"#FFFFFF",32).replace('/>',' opacity=".28"/>');
}
const eyes=(x,y,gap,r)=>[-1,1].map(k=>C(x+k*gap/2,y,r,CREAM)+C(x+k*gap/2+r*.25,y+r*.1,r*.5,INK)+C(x+k*gap/2+r*.4,y-r*.15,r*.18,CREAM)).join("");
const dots=(list,f)=>list.map(a=>C(...a,f)).join("");

function turkey(){

   +C(0,-14,42,BRN)+eyes(0,-22,32,12)+P("M-15 -6 L15 -6 L0 22 Z",YEL)+E(14,14,7,19,RED,-12)
   +R(-34,-72,68,34,6,INK)+R(-54,-46,108,13,6,INK)+R(-34,-58,68,12,0,PINE)+R(-10,-61,20,18,3,YEL);
}

/* a green woodpecker in a flat cap, perched on a striped post */
function woodpecker(){

   +P("M-34 56 L-96 122 L-62 126 L-4 78 Z",PINE)+E(-18,24,50,68,GRN,24)+E(2,40,28,44,"#E9E3B8",24)+E(-42,28,24,52,INK,30)+dots([[-52,6,6],[-40,26,6],[-52,46,6],[-62,66,5],[-32,52,5]],CREAM)
   +C(6,-52,40,GRN)+P("M36 -66 L112 -48 L36 -34 Z",GRY)+E(8,-40,22,13,CREAM,8)+eyes(14,-62,22,10)

/* Biscuit: caramel-and-cream rat, striped apron, checkered cap, cranberry pot */
function biscuit(){
  let check="";for(let i=0;i<6;i++)for(let j=0;j<2;j++)check+=R(-36+i*12,-104+j*12,12,12,0,(i+j)%2?CREAM:BLUE);
  return L("M30 92 Q112 118 118 52 Q120 22 96 24",PINK,12)+E(-26,112,24,11,PINK)+E(26,112,24,11,PINK)+E(0,54,58,60,"#C98748")+E(0,62,38,46,"#F6E3C4")
   +P("M-34 38 L34 38 L44 100 Q0 116 -44 100 Z",CREAM)+L("M-20 40 L-26 104 M0 40 V108 M20 40 L26 104",RED,7)
   +[-1,1].map(k=>C(k*56,-72,31,"#C98748")+C(k*56,-72,19,PINK)).join("")+E(0,-34,52,46,"#C98748")+E(0,-14,32,24,"#F6E3C4")+eyes(0,-44,38,12)+E(0,-22,12,9,BRN)+L("M-14 -7 Q0 6 14 -7",INK,4)
   +L("M-28 -18 L-70 -26 M-28 -10 L-68 -4 M28 -18 L70 -26 M28 -10 L68 -4",INK,2)+check+R(-40,-84,80,11,5,BLUE)
   +P("M-48 -48 L-68 -40 L-50 -32 L-66 -20 L-44 -18 Z M48 -48 L68 -40 L50 -32 L66 -20 L44 -18 Z M-54 40 L-72 52 L-54 58 L-68 72 L-48 74 Z",'#C98748')+L("M-31 -63 L-8 -58 M10 -61 L30 -68",BRN,4.5)
   +L("M-44 34 L-76 50",'#C98748',17)+L("M-80 52 L-104 -2",TAN,9)+E(-108,-12,14,21,TAN,-26)+R(48,40,66,40,12,GRY)+E(81,41,33,9,RED)+R(40,48,12,9,4,INK)+R(110,48,12,9,4,INK)+L("M44 36 L66 60",'#C98748',15);
}
/* Sprocket: copper gardening robot, lantern head, one wheel */
function sprocket(){
  const CU="#C4703F",CU2="#9E5530";
  return C(0,98,28,INK)+C(0,98,12,GRY)+R(-9,58,18,38,5,CU2)+L("M-30 -8 Q-90 4 -72 46 Q-58 70 -86 82",CU2,11)+L("M30 -8 Q86 -2 74 34",CU2,11)
   +P("M-34 -18 L34 -18 L48 62 L-48 62 Z",CU)+C(0,20,20,CREAM)+L("M0 20 L10 8",RED,5)+dots([[-24,48,5],[0,48,5],[24,48,5]],YEL)+R(-10,-34,20,18,3,CU2)
   +R(-42,-102,84,70,26,YEL)+L("M-22 -100 V-34 M22 -100 V-34",CU2,5)+eyes(0,-70,30,11)+L("M-14 -48 Q0 -38 14 -48",INK,4)+P("M-48 -96 L0 -130 L48 -96 Z",CU2)+C(0,-130,8,CU)
   +P("M54 34 L100 34 L92 74 L62 74 Z",BRN)+R(50,28,54,12,4,BRN)+L("M77 28 V-20",PINE,6)+E(63,4,15,7,GRN,28)+[0,1,2,3,4,5,6,7].map(i=>E(77,-46,8,17,ORG).replace('rotate(0 77 -46)',`rotate(${i*45} 77 -26)`)).join("")+C(77,-26,13,BRN);
}

function juniper(){
  const MINT="#8FD0B8",DEEP="#4E9C86";

   +L("M-62 6 Q-126 0 -104 56 Q-92 72 -62 58",DEEP,15)+P("M56 26 Q96 18 106 -30 L128 -26 Q120 52 60 66 Z",MINT)+E(0,28,76,66,MINT)+E(0,-34,46,13,DEEP)
   +R(-48,-4,96,48,22,INK)+C(-20,18,10,SKY)+C(20,18,10,SKY)+L("M-10 32 Q0 39 10 32",SKY,4)+L("M-58 -22 L52 80",BRN,8)+R(28,60,56,40,7,TAN)+P("M28 62 L56 84 L84 62",CREAM)+C(56,82,6,RED)
   +E(0,-52,30,19,RED)+R(-4,-92,8,28,3,INK)+E(-27,-94,28,9,YEL,-8)+E(27,-94,28,9,BLUE,8)+C(0,-94,8,INK);
}
function baker(){
  return [["M-34 14 L-86 -6"],["M34 14 L86 -6"],["M-20 56 L-44 102"],["M20 56 L44 102"]].map(a=>L(a[0],"#BC7A3E",36)).join("")+E(0,28,46,48,"#BC7A3E")+C(0,-42,44,"#BC7A3E")
   +L("M-92 -14 L-82 6 M92 -14 L82 6 M-58 90 L-34 104 M58 90 L34 104",CREAM,5)+P("M-30 12 L30 12 L38 66 Q0 80 -38 66 Z",CREAM)+C(0,44,10,RED)
   +eyes(0,-48,34,10)+L("M-20 -24 Q0 -6 20 -24",CREAM,5)+C(-28,-28,8,"#E8857A")+C(28,-28,8,"#E8857A")
   +edged(C(-26,-108,23,CREAM)+C(26,-108,23,CREAM)+C(0,-118,27,CREAM)+R(-36,-108,72,34,6,CREAM))+R(72,-30,58,13,6,TAN,-40);

function twinkle(){

    stage.setAttribute("viewBox",name==="santa"?"-215 -232 430 420":"-170 -150 340 300");
    stage.innerHTML=name==="santa"?santaBalloon():BALLOONS[Number(name)][1]();
  }
  window.parade={names:BALLOONS.map(b=>b[0])};
}else if(q.has("sheet")){
  const cols=6,rows=Math.ceil(N/cols);
  stage.setAttribute("viewBox",`0 0 ${cols*330} ${rows*340}`);
  stage.innerHTML=`<rect width="${cols*330}" height="${rows*340}" fill="#F1ECE2"/>`+BALLOONS.map(([name,art],i)=>`<g transform="translate(${165+(i%cols)*330} ${164+Math.floor(i/cols)*340})">${art()}${T(0,162,esc(name),20,INK,'font-weight="600"')}</g>`).join("");
}else{
  build();
  if(q.has("at")){                       /* frozen moment for screenshots */
    state.dist=+q.get("at")*GAP;state.t=+(q.get("t")||3);state.snowDepth=+(q.get("depth")||7);
    if(q.get("demo")==="gust")state.gust=state.t-2.2;
    if(q.get("demo")==="hat")state.hat=state.t-4.5;
    if(q.has("party"))state.santaConf=1;
    draw();
  }else{
    let paused=false,last=null,down=null;
    const act={
      pause:()=>paused=!paused,next:()=>state.dist+=GAP,back:()=>state.dist-=GAP,
      night:()=>{night=!night;document.documentElement.style.background=document.body.style.background=THEME[night?"night":"day"].sky;build()},
      snow:()=>snowing=!snowing,wind:()=>state.gust=state.t,hat:()=>state.hat=state.t
    };
    const keys={" ":"pause",arrowright:"next",arrowleft:"back",n:"night",s:"snow",w:"wind",h:"hat"};
    addEventListener("keydown",e=>{
      const k=e.key.toLowerCase();
      if(k==="f")document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
      if(keys[k]){e.preventDefault();act[keys[k]]();draw()}
    });
    stage.addEventListener("pointerdown",e=>down={x:e.clientX,button:e.target.closest("[data-act]")?.dataset.act});
    stage.addEventListener("pointerup",e=>{
      if(!down)return;const dx=e.clientX-down.x;
      act[down.button||(Math.abs(dx)>40?(dx>0?"next":"back"):"pause")]();down=null;draw();
    });
    addEventListener("resize",()=>{const now=innerHeight>innerWidth*1.1;if(now!==portrait){portrait=now;build();draw()}});
    (function tick(now){
      if(last!==null&&!paused){const dt=Math.min(.05,(now-last)/1000);state.dist+=dt*SPEED;state.t+=dt;
        state.snowDepth=snowing?Math.min(13,state.snowDepth+dt*.1):Math.max(0,state.snowDepth-dt*.4);
        if(state.t>state.nextGust){state.gust=state.t;state.nextGust=state.t+24+Math.random()*20}
        if(state.t>state.nextHat){state.hat=state.t;state.nextHat=state.t+32+Math.random()*24}}
      last=now===undefined?null:now;draw();requestAnimationFrame(tick);
    })();
  }
  document.documentElement.style.background=document.body.style.background=THEME[night?"night":"day"].sky;
}
</script>
</body>
</html>
